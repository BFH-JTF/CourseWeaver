services:
  postgres:
    image: postgres:16-alpine
    container_name: courseweaver-postgres
    environment:
      POSTGRES_DB: courseweaver
      POSTGRES_USER: courseweaver
      POSTGRES_PASSWORD: courseweaver
    ports:
      - "5432:5432"
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseweaver -d courseweaver"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courseweaver-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: courseweaver
      POSTGRES_USER: courseweaver
      POSTGRES_PASSWORD: courseweaver
      DATABASE_URL: http://localhost:3000/api
      OIDC_ISSUER: http://doc-pouch:3030/oidc
      OIDC_CLIENT_ID: courseWeaver.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional OIDC identity provider service (docPouch instance as an OIDC provider)
  # docPouch is not used as data storage
  doc-pouch:
    image: ghcr.io/bfh-jtf/doc-pouch:latest
    container_name: courseweaver-docpouch-oidc
    ports:
      - "3030:3030"
    volumes:
      - "./docpouch-db:/app/db"
      - "./docpouch-log:/app/log"
    env_file: .env
    restart: unless-stopped