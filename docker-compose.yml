services:
  postgres:
    image: postgres:16-alpine
    container_name: courseweaver-postgres
    ports:
      - "5432:5432"
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseweaver -d courseweaver"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional OIDC identity provider service (docPouch instance as an OIDC provider)
  # docPouch is not used as data storage
  doc-pouch:
    image: ghcr.io/bfh-jtf/doc-pouch:latest
    container_name: courseweaver-docpouch-oidc
    ports:
      - "3030:3030"
    volumes:
      - "./docpouch-db:/app/db"
      - "./docpouch-log:/app/log"
    environment:
      - PORT=3030
      - MEMORY_ONLY=false
      - JWT_SECRET=change-me-in-production
      - SESSION_TIMEOUT=24h
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - OIDC_ISSUER=http://localhost:3030/oidc
      - OIDC_REGISTRATION_TOKEN=TestToken
      - OIDC_COOKIE_KEY=docpouch-cookie-secret-change-in-production
      - LOG_LEVEL=debug
      - NODE_ENV=development
    restart: unless-stopped